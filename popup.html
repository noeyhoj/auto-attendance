<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LMS+ 출석 도우미</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand-mark" aria-hidden="true">+</span>
        <div>
          <h1>LMS+ 출석 도우미</h1>
          <p>캠퍼스 네트워크에서만 동작합니다.</p>
        </div>
      </header>

      <section class="automation-card" aria-labelledby="automation-title">
        <label class="automation-row">
          <span>
            <strong id="automation-title">자동 실행</strong>
            <small>월–금 · 한국 시간</small>
          </span>
          <input id="automation-toggle" type="checkbox" role="switch" />
        </label>
        <div class="schedule-list">
          <div>
            <span>등교</span>
            <strong>09:35–10:00</strong>
          </div>
          <div>
            <span>하교</span>
            <strong>18:00–18:10</strong>
          </div>
        </div>
        <p>완료될 때까지 1분 간격으로 확인하고, 실패하면 알림을 보냅니다.</p>
      </section>

      <section class="actions" aria-label="출석 처리">
        <button type="button" class="action check-in" data-action="check-in">
          <span>등교하기</span>
          <small id="check-in-hint">실제 LMS 등교 버튼 실행</small>
        </button>
        <button type="button" class="action check-out" data-action="check-out">
          <span>하교하기</span>
          <small id="check-out-hint">LMS에서 등교 완료를 확인한 뒤 실행</small>
        </button>
      </section>

      <section id="status" class="status idle" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">현재 LMS 출석 상태를 확인하고 있어요…</span>
      </section>

      <p class="privacy">Mac이 깨어 있고 Chrome이 실행 중이어야 합니다. 로그인 정보와 출석 결과는 저장하지 않습니다.</p>
    </main>
    <dialog id="early-checkout-dialog" aria-labelledby="early-checkout-title">
      <form method="dialog">
        <span class="dialog-icon" aria-hidden="true">!</span>
        <h2 id="early-checkout-title">18시 이전 하교</h2>
        <p>지금 하교하면 조기 하교로 기록될 수 있습니다. 그래도 하교를 진행할까요?</p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="dialog-cancel" autofocus>취소</button>
          <button type="submit" value="confirm" class="dialog-confirm">그래도 하교하기</button>
        </div>
      </form>
    </dialog>
    <script src="schedule.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
